name: Canary — plugin vs Claude Code latest

on:
  workflow_call:
  workflow_dispatch:

jobs:
  contract:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Build pinned Inkbox SDK wheel
        run: tests/ci/retry_install.sh bash tests/ci/build_inkbox_sdk.sh

      - name: Install bridge + latest SDK
        run: |
          tests/ci/retry_install.sh uv pip install --system --no-sources \
            "$INKBOX_SDK_WHEEL" \
            -e . pytest
          tests/ci/retry_install.sh uv pip install --system -U claude-agent-sdk

      - name: Install latest Claude Code CLI
        run: tests/ci/retry_install.sh npm install -g @anthropic-ai/claude-code

      # Re-run the complete offline suite twice daily against the newest SDK
      # and CLI. Live tests self-skip here and are run by Full stack e2e after
      # this canary passes.
      - name: Full offline suite vs latest host
        run: pytest -q
