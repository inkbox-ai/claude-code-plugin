name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Offline tests exercise SDK pagination with a mocked transport.
  unit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install test deps
        run: tests/ci/retry_install.sh uv pip install --system pytest httpx aiohttp segno "psutil>=5.9,<8" "audioop-lts>=0.2.1; python_version >= '3.13'" claude-agent-sdk "inkbox==0.7.15"

      # tests/contract runs in its own job against the LATEST host, not here.
      # tests/live is collected but self-skips without the live API keys.
      - name: Test
        run: pytest -q --ignore=tests/contract

  # Contract suite — the bridge's view of the host interface, checked against
  # the latest published claude-agent-sdk + Claude Code CLI so upstream drift
  # fails a PR here instead of a live gateway later.
  contract-pr:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install bridge + latest SDK
        run: |
          tests/ci/retry_install.sh uv pip install --system \
            "inkbox==0.7.15" \
            -e . "inkbox==0.7.15" pytest
          tests/ci/retry_install.sh uv pip install --system -U claude-agent-sdk

      - name: Install latest Claude Code CLI
        run: tests/ci/retry_install.sh npm install -g @anthropic-ai/claude-code

      - name: Contract tests vs latest host
        run: pytest -q tests/contract

  sdk-minimums:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      matrix:
        sdk: ["0.7.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install published SDK minimum
        run: tests/ci/retry_install.sh uv pip install --system -e . pytest "inkbox==${{ matrix.sdk }}"
      - name: Base SDK contracts
        run: pytest -q tests/test_tools.py tests/test_slack.py tests/test_vault_tools.py tests/test_group_routes.py
      - name: Native iMessage SDK contract
        run: |
          python -c 'from inkbox.agent_identity import AgentIdentity; from inkbox_claude.config import imessage_threading_capability; assert imessage_threading_capability(AgentIdentity)[0]'
          pytest -q tests/test_imessage_sdk.py
