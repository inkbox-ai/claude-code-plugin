name: Full stack e2e

# The live suites share one AUT identity and tunnel, so a single orchestrator
# owns that lock and runs every component in sequence. This prevents separate
# PR workflows from replacing one another in GitHub's concurrency queue and
# gives branch protection one aggregate result that fails if any suite is
# missing, skipped, cancelled, or failed.

on:
  schedule:
    - cron: "13 12 * * *"
    - cron: "13 0 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: inkbox-live-aut-tunnel
  cancel-in-progress: false
  queue: max

jobs:
  canary:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/canary.yml

  channels:
    needs: canary
    if: >
      !cancelled() && needs.canary.result == 'success' &&
      ((github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule')
    uses: ./.github/workflows/live-channels.yml
    with:
      orchestrated: true
    secrets: inherit

  a2a:
    needs: channels
    if: >
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    uses: ./.github/workflows/live-a2a.yml
    with:
      orchestrated: true
    secrets: inherit

  voice:
    needs: a2a
    if: >
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    uses: ./.github/workflows/live-voice.yml
    with:
      orchestrated: true
    secrets: inherit

  external-events:
    needs: voice
    if: >
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    uses: ./.github/workflows/live-external-events.yml
    with:
      orchestrated: true
    secrets: inherit

  full-stack:
    name: full-stack
    needs: [channels, a2a, voice, external-events]
    if: >
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Require every live suite to pass
        env:
          CHANNELS_RESULT: ${{ needs.channels.result }}
          A2A_RESULT: ${{ needs.a2a.result }}
          VOICE_RESULT: ${{ needs.voice.result }}
          EXTERNAL_EVENTS_RESULT: ${{ needs.external-events.result }}
        run: |
          failed=0
          for suite in CHANNELS A2A VOICE EXTERNAL_EVENTS; do
            result_var="${suite}_RESULT"
            result="${!result_var}"
            echo "$suite: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
