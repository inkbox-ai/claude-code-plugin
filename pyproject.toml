[project]
name = "claude-code-plugin"
version = "0.2.30"
description = "Inkbox bridge for Claude Code — talk to your coding agent over email, Slack, SMS, iMessage, WhatsApp, and voice"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "psutil>=5.9,<8",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
  "inkbox>=0.7.39,<1.0.0",
  "claude-agent-sdk==0.2.158",
  "segno>=1.5",  # terminal QR codes for the iMessage connect step
]

[project.scripts]
inkbox-claude = "inkbox_claude.cli:main"

[tool.setuptools.packages.find]
include = ["inkbox_claude*"]

[tool.setuptools.package-data]
# Ship the bundled Claude Code avatar attached to agents during setup.
inkbox_claude = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
inkbox = { git = "https://github.com/inkbox-ai/inkbox.git", rev = "84386f5ea022a9594fb901894f927ee444c2cf91", subdirectory = "sdk/python" }
